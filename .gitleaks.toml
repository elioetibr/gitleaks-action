#
# Repo-specific gitleaks configuration. Extends the default ruleset; only
# adds allowlists for known-public constants and the auto-generated bundle.

[extend]
useDefault = true

[allowlist]
description = """
Allowlist for known-public constants bundled into dist/index.js by transitive
dependencies. dist/index.js is generated by ncc from src/; secret review for
this repo happens against src/, which remains fully scanned.
"""

# The Azurite (Azure Storage Emulator) well-known default AccountKey is
# published by Microsoft in public documentation and ships hardcoded in
# @azure/storage-blob (transitively required by @actions/cache).
# Reference: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azurite#well-known-storage-account-and-key
regexes = [
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==''',
]

# The bundled output is regenerated on every build; its contents come from
# transitive npm/bun dependencies, not this repo's source.
paths = [
  '''^dist/index\.js$''',
]
