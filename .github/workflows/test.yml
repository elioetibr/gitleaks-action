#
# CI test workflow: runs the bun:test unit suite and verifies that dist/ is up
# to date with src/. Bun version is pinned via package.json#packageManager so
# CI and local dev use the same toolchain.

name: tests

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
      - name: Build dist
        run: bun run build
      - name: Verify dist is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date — run 'bun run build' and commit the result."
            git --no-pager diff -- dist | head -100
            exit 1
          fi
